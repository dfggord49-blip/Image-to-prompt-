<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Prompt & Gemini Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h2 { text-align: center; }
        p { color: #bbb; font-size: 14px; text-align: center; }
        input[type="file"] { margin: 15px 0; width: 100%; }
        img { max-width: 100%; margin-top: 15px; border-radius: 8px; display: none; }
        #result { margin-top: 15px; padding: 10px; background: #2a2a2a; border-radius: 8px; word-wrap: break-word; text-align: left; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b3b98;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #575fc0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Image to Prompt Converter</h2>
    <p>ဓာတ်ပုံတင်ပါ၊ Gemini က Prompt ထုတ်ပေးပါလိမ့်မည်။</p>

    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    <img id="preview">

    <button onclick="generatePrompt()">Prompt ထုတ်မည်</button>

    <div id="result">Prompt ထုတ်ယူရန် စောင့်ဆိုင်းပါ...</div>
    <button id="chatBtn" style="display:none; background: #10ac84;" onclick="goToGemini()">Gemini နဲ့ ကိုယ်တိုင် စကားပြောမည်</button>
</div>

<script>
    const API_KEY = "AQ.Ab8RN6J2qkxkNCGq6xt6sablRhgKzv0Yupi97xkETM4vWivPOA";
    let generatedPromptText = "";

    function previewImage(event) {
        const img = document.getElementById('preview');
        img.src = URL.createObjectURL(event.target.files[0]);
        img.style.display = 'block';
    }

    async function generatePrompt() {
        const fileInput = document.getElementById('imageInput');
        const resultDiv = document.getElementById('result');
        const chatBtn = document.getElementById('chatBtn');

        if (!fileInput.files[0]) {
            alert("ကျေးဇူးပြု၍ ဓာတ်ပုံ ရွေးချယ်ပါ");
            return;
        }

        resultDiv.innerText = "Prompt ထုတ်ယူနေပါသည်... ခဏစောင့်ပါ။";

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onloadend = async () => {
            const base64Data = reader.result.split(',')[1];
            const mimeType = fileInput.files[0].type;

            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + API_KEY;

            const payload = {
                contents: [{
                    parts: [
                        { text: "Analyze this image in extreme detail and convert it into a highly descriptive AI image generation prompt." },
                        { inline_data: { mime_type: mimeType, data: base64Data } }
                    ]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    generatedPromptText = data.candidates[0].content.parts[0].text;
                    resultDiv.innerText = generatedPromptText;
                    chatBtn.style.display = 'block';
                } else if (data.error) {
                    resultDiv.innerText = "API Error: " + data.error.message;
                } else {
                    resultDiv.innerText = "API မှ အကြောင်းပြန်ချက်မရရှိပါ (API Key သက်တမ်းကုန်လွန်ခြင်း သို့မဟုတ် VPN ကြောင့် ဖြစ်နိုင်ပါသည်)";
                }
            } catch (err) {
                resultDiv.innerText = "Error ဖြစ်ပေါ်ခဲ့ပါသည်: " + err.message;
            }
        };
    }

    function goToGemini() {
        window.open("https://gemini.google.com", "_blank");
    }
</script>

</body>
</html>
